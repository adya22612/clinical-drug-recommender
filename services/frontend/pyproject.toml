[project]
name = "frontend"
version = "0.1.0"
description = "Clinical Recommender UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.31.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true