[project]
name = "evaluation"
version = "0.1.0"
description = "Evaluation harness for the clinical drug recommender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1",
    "motor>=3.3.2,<4",
    "pandas>=2.2.0,<3",
    "chromadb>=0.4.24,<2",
    "sentence-transformers>=2.6.0,<6",
    "pydantic-settings>=2.1.0,<3",
    "ragas>=0.2.0,<0.4",
    "langchain-ollama>=0.2.0,<1",
    "datasets>=2.19.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.hatch.build.targets.wheel]
packages = ["."]
